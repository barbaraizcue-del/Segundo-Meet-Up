<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Meet Up</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #667eea; padding: 15px; min-height: 100vh; }
        .container { max-width: 100%; background: white; border-radius: 10px; padding: 20px; }
        h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; background: #ddd; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .tab.active { background: #667eea; color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        label { display: block; font-weight: bold; color: #333; margin: 15px 0 8px 0; }
        select, input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .fecha-btn, .hora-btn { 
            padding: 12px; border: 2px solid #ddd; background: white; cursor: pointer; 
            border-radius: 5px; font-weight: bold; transition: all 0.2s; text-align: center;
            -webkit-user-select: none; user-select: none;
        }
        .fecha-btn:active { border-color: #667eea; background: #f5f5ff; }
        .fecha-btn.seleccionada { background: #667eea; color: white; border-color: #667eea; }
        .hora-btn:active { border-color: #ff9800; background: #fff3e0; }
        .hora-btn.seleccionada { background: #ff9800; color: white; border-color: #ff9800; }
        .info { background: #e3f2fd; padding: 10px; border-radius: 5px; color: #0d47a1; margin: 15px 0; font-weight: bold; }
        .resumen { background: #e8f5e9; padding: 15px; border-radius: 5px; margin: 15px 0; border-left: 4px solid #4CAF50; }
        .resumen h4 { color: #2e7d32; margin-bottom: 10px; }
        .resumen p { color: #1b5e20; margin: 5px 0; font-size: 0.9em; }
        button[type="submit"], button.guardar { background: #4CAF50; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin: 10px 0; }
        button[type="submit"]:active, button.guardar:active { background: #388E3C; }
        button.limpiar { background: #999; }
        button.limpiar:active { background: #777; }
        .msg { padding: 12px; border-radius: 5px; margin: 15px 0; display: none; text-align: center; font-weight: bold; }
        .msg.success { background: #d4edda; color: #155724; display: block; }
        .msg.error { background: #f8d7da; color: #721c24; display: block; }
        h3 { color: #333; margin: 20px 0 10px 0; }
        .placeholder { color: #999; text-align: center; padding: 20px; grid-column: 1/-1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤝 SEGUNDO MEET UP</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="cambiarTab(0)">🏢 EMPRESA</button>
            <button class="tab" onclick="cambiarTab(1)">👥 CDN</button>
            <button class="tab" onclick="cambiarTab(2)">🔐 ADMIN</button>
        </div>

        <div id="p0" class="panel active">
            <h2 style="color: #667eea; margin-bottom: 20px;">Registrar Disponibilidad</h2>
            <div id="msg" class="msg"></div>

            <label>🏢 Empresa:</label>
            <select id="empresa">
                <option value="">-- Selecciona --</option>
                <option>Abastible</option><option>Aeropuerto</option><option>Agrosuper</option>
                <option>Andina</option><option>Angloamérica</option><option>Antofagasta Minerals</option>
                <option>Aramark</option><option>BCI</option><option>BHP</option><option>Cencosud</option>
                <option>Chilecompra</option><option>CMPC</option><option>Empresa Arauco</option>
                <option>Enel</option><option>Enex</option><option>Lipigas</option>
                <option>Lokal Shop</option><option>Mall Plaza</option><option>Mercado Libre</option>
                <option>Metro</option><option>Simón de Cirene</option><option>SMU</option>
                <option>Sopraval</option><option>Sura</option><option>Viña Chocalán</option><option>Walmart</option>
            </select>

            <label>📧 Email:</label>
            <input type="email" id="email" placeholder="contacto@empresa.com">

            <h3>📅 Fechas (días hábiles noviembre):</h3>
            <div class="grid" id="fechas"></div>
            <div class="info" id="cFechas">0 fechas seleccionadas</div>

            <h3>🕐 Horarios (08:30 - 18:30):</h3>
            <div class="grid" id="horarios"><p class="placeholder">👆 Selecciona una fecha primero</p></div>
            <div class="info" id="cHorarios">0 horarios seleccionados</div>

            <div class="resumen">
                <h4>✅ Resumen:</h4>
                <div id="resumen"><p style="color: #999;">Completa los campos</p></div>
            </div>

            <button type="submit" class="guardar" onclick="guardar()">💾 GUARDAR</button>
            <button type="button" class="limpiar" onclick="limpiar()">🔄 Limpiar</button>
        </div>

        <div id="p1" class="panel"><h2 style="color: #667eea;">Agendar Reuniones</h2><p style="color: #999;">En desarrollo...</p></div>
        <div id="p2" class="panel"><h2 style="color: #667eea;">Panel Admin</h2><p style="color: #999;">En desarrollo...</p></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA71yIZ3DAx8dbD0PZqll0zWTPdeYjEvjo",
            authDomain: "cumbre-encadenamiento.firebaseapp.com",
            projectId: "cumbre-encadenamiento",
            storageBucket: "cumbre-encadenamiento.firebasestorage.app",
            messagingSenderId: "130375110256",
            appId: "1:130375110256:web:a45405c39732cc5788aeb5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const HORAS = ["08:30-09:30", "09:30-10:30", "10:30-11:30", "11:30-12:30", 
                       "12:30-13:30", "13:30-14:30", "14:30-15:30", "15:30-16:30", 
                       "16:30-17:30", "17:30-18:30"];

        let fechasSeleccionadas = [];
        let horariosSeleccionados = [];

        function generarFechas() {
            const fechas = [];
            for (let i = 1; i <= 30; i++) {
                const d = new Date(2026, 10, i);
                const ds = d.getDay();
                if (ds !== 0 && ds !== 6) {
                    const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                    fechas.push({ num: i, dia: dias[ds], str: i + '-11-2026' });
                }
            }
            return fechas;
        }

        function inicializar() {
            const fechas = generarFechas();
            const fechasDiv = document.getElementById('fechas');
            let html = '';
            fechas.forEach((f, idx) => {
                html += '<button type="button" class="fecha-btn" id="fecha_' + idx + '" data-fecha="' + f.str + '" onclick="selFecha(this)">' + f.dia + ' ' + f.num + '</button>';
            });
            fechasDiv.innerHTML = html;
        }

        function cambiarTab(n) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('p' + n).classList.add('active');
            event.target.classList.add('active');
        }

        function selFecha(btn) {
            const fecha = btn.getAttribute('data-fecha');
            btn.classList.toggle('seleccionada');
            
            const idx = fechasSeleccionadas.indexOf(fecha);
            if (idx >= 0) {
                fechasSeleccionadas.splice(idx, 1);
            } else {
                fechasSeleccionadas.push(fecha);
            }
            
            actualizarFechas();
            renderHorarios();
            actualizar();
        }

        function actualizarFechas() {
            document.getElementById('cFechas').innerText = fechasSeleccionadas.length + ' fecha(s) seleccionada(s)';
        }

        function renderHorarios() {
            const horariosDiv = document.getElementById('horarios');
            horariosSeleccionados = [];
            document.getElementById('cHorarios').innerText = '0 horarios seleccionados';

            if (fechasSeleccionadas.length === 0) {
                horariosDiv.innerHTML = '<p class="placeholder">👆 Selecciona una fecha primero</p>';
                return;
            }

            let html = '';
            HORAS.forEach((h, idx) => {
                html += '<button type="button" class="hora-btn" id="hora_' + idx + '" data-hora="' + h + '" onclick="selHorario(this)">' + h + '</button>';
            });
            horariosDiv.innerHTML = html;
        }

        function selHorario(btn) {
            const hora = btn.getAttribute('data-hora');
            btn.classList.toggle('seleccionada');
            
            const idx = horariosSeleccionados.indexOf(hora);
            if (idx >= 0) {
                horariosSeleccionados.splice(idx, 1);
            } else {
                horariosSeleccionados.push(hora);
            }
            
            document.getElementById('cHorarios').innerText = horariosSeleccionados.length + ' horarios seleccionados';
            actualizar();
        }

        function actualizar() {
            const emp = document.getElementById('empresa').value;
            const mail = document.getElementById('email').value;
            const div = document.getElementById('resumen');

            if (!emp || !mail || fechasSeleccionadas.length === 0 || horariosSeleccionados.length === 0) {
                div.innerHTML = '<p style="color: #999;">Completa todos los campos</p>';
                return;
            }

            let html = '<p style="font-weight: bold; color: #1565c0;">' + emp + '</p>';
            html += '<p style="color: #666; font-size: 0.9em;">' + mail + '</p>';
            html += '<p style="margin-top: 10px; color: #2e7d32; font-weight: bold;">📅 ' + fechasSeleccionadas.length + ' fecha(s)</p>';
            html += '<p style="color: #0d47a1; font-weight: bold;">🕐 ' + horariosSeleccionados.length + ' horario(s):</p>';
            horariosSeleccionados.forEach(h => {
                html += '<p style="margin-left: 15px; color: #1565c0; font-size: 0.85em;">✓ ' + h + '</p>';
            });
            div.innerHTML = html;
        }

        async function guardar() {
            const emp = document.getElementById('empresa').value;
            const mail = document.getElementById('email').value;

            if (!emp || !mail || fechasSeleccionadas.length === 0 || horariosSeleccionados.length === 0) {
                mostrar('❌ Completa todos los campos', 'error');
                return;
            }

            try {
                const disp = [];
                fechasSeleccionadas.forEach(f => {
                    horariosSeleccionados.forEach(h => {
                        disp.push({ fecha: f, horario: h });
                    });
                });

                await db.collection('empresas').doc(emp).set({
                    nombre: emp,
                    email: mail,
                    disponibilidad: disp,
                    fechaRegistro: new Date().toISOString()
                });

                mostrar('✅ ' + emp + ' guardada - ' + disp.length + ' espacios registrados', 'success');
                setTimeout(() => limpiar(), 2000);
            } catch (e) {
                mostrar('❌ Error: ' + e.message, 'error');
            }
        }

        function limpiar() {
            fechasSeleccionadas = [];
            horariosSeleccionados = [];
            document.getElementById('empresa').value = '';
            document.getElementById('email').value = '';
            document.querySelectorAll('.fecha-btn, .hora-btn').forEach(b => b.classList.remove('seleccionada'));
            document.getElementById('horarios').innerHTML = '<p class="placeholder">👆 Selecciona una fecha primero</p>';
            actualizarFechas();
            document.getElementById('cHorarios').innerText = '0 horarios seleccionados';
            actualizar();
        }

        function mostrar(txt, tipo) {
            const m = document.getElementById('msg');
            m.innerText = txt;
            m.className = 'msg ' + tipo;
            setTimeout(() => { m.className = 'msg'; }, 4000);
        }

        window.addEventListener('DOMContentLoaded', inicializar);
    </script>
</body>
</html>
