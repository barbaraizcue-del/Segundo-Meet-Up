<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Meet Up - Agendamiento</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #667eea; padding: 15px; min-height: 100vh; }
        .container { max-width: 100%; background: white; border-radius: 10px; padding: 20px; }
        h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; background: #ddd; border: none; cursor: pointer; border-radius: 5px; }
        .tab.active { background: #667eea; color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        input, select { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
        .btn-hora { padding: 12px; border: 2px solid #ddd; background: white; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .btn-hora.sel { background: #667eea; color: white; border-color: #667eea; }
        button { background: #4CAF50; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        .info { background: #e3f2fd; padding: 10px; border-radius: 5px; margin: 10px 0; color: #0d47a1; }
        .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤝 SEGUNDO MEET UP</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab(0)">🏢 EMPRESA</button>
            <button class="tab" onclick="switchTab(1)">👥 CDN</button>
            <button class="tab" onclick="switchTab(2)">🔐 ADMIN</button>
        </div>

        <!-- PANEL EMPRESA -->
        <div id="panel0" class="panel active">
            <h2 style="color: #667eea; margin-bottom: 15px;">Registrar Disponibilidad</h2>
            
            <div id="msg-empresa"></div>

            <label>🏢 Empresa:</label>
            <select id="empresa">
                <option value="">-- Selecciona --</option>
                <option>Abastible</option>
                <option>Aeropuerto</option>
                <option>Agrosuper</option>
                <option>Andina</option>
                <option>Angloamérica</option>
                <option>Antofagasta Minerals</option>
                <option>Aramark</option>
                <option>BCI</option>
                <option>BHP</option>
                <option>Cencosud</option>
                <option>Chilecompra</option>
                <option>CMPC</option>
                <option>Empresa Arauco</option>
                <option>Enel</option>
                <option>Enex</option>
                <option>Lipigas</option>
                <option>Lokal Shop</option>
                <option>Mall Plaza</option>
                <option>Mercado Libre</option>
                <option>Metro</option>
                <option>Simón de Cirene</option>
                <option>SMU</option>
                <option>Sopraval</option>
                <option>Sura</option>
                <option>Viña Chocalán</option>
                <option>Walmart</option>
            </select>

            <label>📧 Email:</label>
            <input type="email" id="email" placeholder="contacto@empresa.com">

            <label>📅 Día:</label>
            <select id="dia">
                <option value="">-- Elige día --</option>
                <option value="1">Lunes 3 Nov</option>
                <option value="2">Martes 4 Nov</option>
                <option value="3">Miércoles 5 Nov</option>
                <option value="4">Jueves 6 Nov</option>
                <option value="5">Viernes 7 Nov</option>
            </select>

            <div class="info" id="contador">0 horarios seleccionados</div>

            <h3 style="margin: 20px 0 10px 0; color: #333;">Horarios disponibles:</h3>
            <div class="grid" id="horarios-container">
                <p style="grid-column: 1/-1; text-align: center; color: #999;">Selecciona un día</p>
            </div>

            <div style="background: #e8f5e9; padding: 15px; border-radius: 5px; margin: 15px 0;">
                <h4 style="color: #2e7d32; margin-bottom: 10px;">✅ Resumen:</h4>
                <div id="resumen-emp" style="color: #1b5e20;">
                    <p>Completa los campos</p>
                </div>
            </div>

            <button onclick="guardarEmpresa()">💾 GUARDAR</button>
            <button onclick="limpiarEmpresa()" style="background: #999; margin-top: 10px;">🔄 Limpiar</button>
        </div>

        <!-- PANEL CDN -->
        <div id="panel1" class="panel">
            <h2 style="color: #667eea;">Agendar Reuniones</h2>
            <p style="color: #999;">En desarrollo...</p>
        </div>

        <!-- PANEL ADMIN -->
        <div id="panel2" class="panel">
            <h2 style="color: #667eea;">Panel Admin</h2>
            <p style="color: #999;">En desarrollo...</p>
        </div>
    </div>

    <script>
        // ============== FIREBASE ==============
        const firebaseConfig = {
            apiKey: "AIzaSyA71yIZ3DAx8dbD0PZqll0zWTPdeYjEvjo",
            authDomain: "cumbre-encadenamiento.firebaseapp.com",
            projectId: "cumbre-encadenamiento",
            storageBucket: "cumbre-encadenamiento.firebasestorage.app",
            messagingSenderId: "130375110256",
            appId: "1:130375110256:web:a45405c39732cc5788aeb5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============== DATOS ==============
        const HORARIOS = ["08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30"];
        const DIAS_NOMBRES = {
            "1": "Lunes 3 Nov",
            "2": "Martes 4 Nov",
            "3": "Miércoles 5 Nov",
            "4": "Jueves 6 Nov",
            "5": "Viernes 7 Nov"
        };

        // ============== ESTADO ==============
        let horariosSeleccionados = [];

        // ============== FUNCIONES PRINCIPALES ==============
        function switchTab(n) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('panel' + n).classList.add('active');
            event.target.classList.add('active');
        }

        function cargarHorariosDelDia() {
            const diaSeleccionado = document.getElementById('dia').value;
            const container = document.getElementById('horarios-container');
            
            horariosSeleccionados = [];
            actualizarContador();
            actualizarResumen();

            if (!diaSeleccionado) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">Selecciona un día</p>';
                return;
            }

            let html = '';
            HORARIOS.forEach(horario => {
                html += `<button type="button" class="btn-hora" data-hora="${horario}" onclick="toggleHorario('${horario}', this)">${horario}</button>`;
            });
            
            container.innerHTML = html;
        }

        function toggleHorario(horario, elemento) {
            elemento.classList.toggle('sel');
            
            const index = horariosSeleccionados.indexOf(horario);
            if (index > -1) {
                horariosSeleccionados.splice(index, 1);
            } else {
                horariosSeleccionados.push(horario);
            }
            
            actualizarContador();
            actualizarResumen();
        }

        function actualizarContador() {
            document.getElementById('contador').innerText = horariosSeleccionados.length + ' horarios seleccionados';
        }

        function actualizarResumen() {
            const empresa = document.getElementById('empresa').value;
            const email = document.getElementById('email').value;
            const dia = document.getElementById('dia').value;
            const resumen = document.getElementById('resumen-emp');

            if (!empresa || !email || !dia || horariosSeleccionados.length === 0) {
                resumen.innerHTML = '<p style="color: #999;">Completa todos los campos</p>';
                return;
            }

            let html = `<p><strong style="color: #1565c0;">${empresa}</strong></p>`;
            html += `<p>${email}</p>`;
            html += `<p style="margin-top: 10px;"><strong>📅 ${DIAS_NOMBRES[dia]}</strong></p>`;
            html += `<p style="margin-top: 10px;">🕐 ${horariosSeleccionados.length} horarios:</p>`;
            
            horariosSeleccionados.forEach(h => {
                html += `<p style="margin-left: 15px;">✓ ${h}</p>`;
            });

            resumen.innerHTML = html;
        }

        async function guardarEmpresa() {
            const empresa = document.getElementById('empresa').value;
            const email = document.getElementById('email').value;
            const diaNum = parseInt(document.getElementById('dia').value);

            if (!empresa || !email || !diaNum || horariosSeleccionados.length === 0) {
                mostrarMensaje('msg-empresa', '❌ Completa todos los campos', 'error');
                return;
            }

            try {
                const disponibilidad = horariosSeleccionados.map(h => ({
                    dia: diaNum,
                    horario: h
                }));

                const docActual = await db.collection('empresas').doc(empresa).get();
                let todaDisponibilidad = [];

                if (docActual.exists && docActual.data().disponibilidad) {
                    todaDisponibilidad = docActual.data().disponibilidad.filter(d => d.dia !== diaNum);
                }

                todaDisponibilidad = [...todaDisponibilidad, ...disponibilidad];

                await db.collection('empresas').doc(empresa).set({
                    nombre: empresa,
                    email: email,
                    disponibilidad: todaDisponibilidad,
                    fechaRegistro: new Date().toISOString()
                });

                mostrarMensaje('msg-empresa', `✅ ${empresa} guardada correctamente con ${disponibilidad.length} horarios`, 'success');
                
                setTimeout(() => {
                    limpiarEmpresa();
                }, 2000);
            } catch (error) {
                mostrarMensaje('msg-empresa', `❌ Error: ${error.message}`, 'error');
            }
        }

        function limpiarEmpresa() {
            horariosSeleccionados = [];
            document.getElementById('empresa').value = '';
            document.getElementById('email').value = '';
            document.getElementById('dia').value = '';
            document.getElementById('horarios-container').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">Selecciona un día</p>';
            actualizarContador();
            actualizarResumen();
        }

        function mostrarMensaje(elementId, texto, tipo) {
            const elemento = document.getElementById(elementId);
            elemento.className = tipo;
            elemento.innerText = texto;
            
            setTimeout(() => {
                elemento.className = '';
                elemento.innerText = '';
            }, 4000);
        }

        // ============== EVENT LISTENERS ==============
        document.getElementById('dia').addEventListener('change', cargarHorariosDelDia);
        document.getElementById('empresa').addEventListener('change', actualizarResumen);
        document.getElementById('email').addEventListener('change', actualizarResumen);

        console.log('✅ Sistema cargado correctamente');
    </script>
</body>
</html>
