<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Meet Up - Sistema de Agendamiento</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .panel {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
        }
        .checkbox-item input {
            width: auto;
            margin-right: 10px;
        }
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .time-btn {
            padding: 10px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .time-btn:hover {
            background: #e0e0e0;
            border-color: #667eea;
        }
        .time-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-secondary { background: #999; }
        .btn-secondary:hover { background: #777; }
        .message {
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.show { display: block; }
        .role-btn {
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.1em;
        }
        .role-selection { text-align: center; margin-bottom: 30px; }
        .hidden { display: none; }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .google-user {
            background: #e8f5e9;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #4caf50;
        }
        .empresa-card {
            background: #f9f9f9;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        .empresa-card button {
            padding: 6px 12px;
            font-size: 0.85em;
            margin-top: 8px;
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.8em; }
            .time-slots { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤝 Segundo Meet Up</h1>
            <p>Sistema de Agendamiento - Noviembre 2026</p>
        </div>

        <div class="role-selection" id="roleSelection">
            <button class="role-btn" onclick="selectRole('empresa')">🏢 Empresa</button>
            <button class="role-btn" onclick="selectRole('cdn')">👥 Centro de Negocio (CDN)</button>
            <button class="role-btn" onclick="selectRole('admin')">⚙️ Administrador</button>
        </div>

        <div id="mainContent" style="display: none;">
            <!-- PANEL EMPRESA -->
            <div id="empresaPanel" class="main-content hidden">
                <div class="panel">
                    <h2>📝 Registrar Disponibilidad</h2>
                    <div id="empresaMessage" class="message"></div>

                    <div class="form-group">
                        <label>Selecciona tu Empresa:</label>
                        <select id="empresaSelect">
                            <option value="">-- Selecciona una empresa --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Email de Contacto:</label>
                        <input type="email" id="empresaEmail" placeholder="tu-email@empresa.com">
                    </div>

                    <div class="form-group">
                        <label>Días disponibles (Noviembre 2026):</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="dia4" value="4">
                                <label for="dia4">4 Lunes</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="dia5" value="5">
                                <label for="dia5">5 Martes</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="dia6" value="6">
                                <label for="dia6">6 Miércoles</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="dia7" value="7">
                                <label for="dia7">7 Jueves</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="dia8" value="8">
                                <label for="dia8">8 Viernes</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="dia11" value="11">
                                <label for="dia11">11 Lunes</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="dia12" value="12">
                                <label for="dia12">12 Martes</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="dia13" value="13">
                                <label for="dia13">13 Miércoles</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Horarios disponibles:</label>
                        <div class="time-slots" id="horariosBotones"></div>
                    </div>

                    <div class="btn-group">
                        <button onclick="guardarDisponibilidadEmpresa()">✅ Guardar</button>
                        <button class="btn-secondary" onclick="limpiarFormularioEmpresa()">🔄 Limpiar</button>
                        <button class="btn-secondary" onclick="volverAlRoleSelection()">⬅️ Atrás</button>
                    </div>
                </div>
            </div>

            <!-- PANEL CDN -->
            <div id="cdnPanel" class="main-content hidden">
                <div class="panel">
                    <h2>🔍 Buscar y Agendar</h2>
                    <div id="cdnMessage" class="message"></div>

                    <div class="form-group">
                        <label>Tu CDN:</label>
                        <select id="cdnSelect">
                            <option value="">-- Selecciona tu CDN --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tu Email:</label>
                        <input type="email" id="cdnEmail" placeholder="tu-email@cdn.sercotec.cl">
                    </div>

                    <div class="form-group">
                        <label>Empresas Disponibles:</label>
                        <div id="empresasDisponibles" style="max-height: 400px; overflow-y: auto;">
                            <p style="color: #999;">Cargando empresas...</p>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button onclick="cargarEmpresasDisponiblesCDN()">🔄 Actualizar</button>
                        <button class="btn-secondary" onclick="volverAlRoleSelection()">⬅️ Atrás</button>
                    </div>
                </div>

                <div class="panel">
                    <h2>📅 Mis Reuniones</h2>
                    <div id="reunionesAgendadas">
                        <p style="color: #999;">No hay reuniones aún</p>
                    </div>
                </div>
            </div>

            <!-- PANEL ADMIN -->
            <div id="adminPanel" class="main-content hidden">
                <div class="panel">
                    <h2>⚙️ Panel Administrativo</h2>
                    <div id="adminMessage" class="message"></div>

                    <div class="form-group">
                        <label>Contraseña Admin:</label>
                        <input type="password" id="adminPassword" placeholder="Ingresa contraseña">
                        <button onclick="validarAdminPassword()">Acceder</button>
                    </div>

                    <div id="adminDashboard" class="hidden">
                        <div style="margin: 20px 0;">
                            <p><strong>Empresas Registradas:</strong> <span id="totalEmpresas">0</span></p>
                            <p><strong>Reuniones Agendadas:</strong> <span id="totalReuniones">0</span></p>
                        </div>
                        <button onclick="volverAlRoleSelection()" class="btn-secondary">⬅️ Salir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

    <script>
        // ========== VARIABLES GLOBALES ==========
        let db = null;
        let currentRole = null;
        let selectedHorarios = new Set();

        // ========== DATOS CONSTANTES ==========
        const EMPRESAS = [
            "Abastible", "Aeropuerto", "Agrosuper", "Andina", "Angloamérica", 
            "Antofagasta Minerals", "Aramark", "BCI", "BHP", "Cencosud", 
            "Chilecompra", "CMPC", "Empresa Arauco", "Enel", "Enex", 
            "Lipigas", "Lokal Shop", "Mall Plaza", "Mercado Libre", "Metro", 
            "Simón de Cirene", "SMU", "Sopraval", "Sura", "Viña Chocalán", "Walmart"
        ];

        const CDN = [
            "CDN Arica y Parinacota", "CDN Tarapacá", "CDN Antofagasta", "CDN Atacama",
            "CDN Coquimbo", "CDN Valparaíso", "CDN RM Providencia", "CDN RM Santiago Centro",
            "CDN RM La Florida", "CDN RM Maipú", "CDN RM Ñuñoa", "CDN RM Estación Central",
            "CDN RM Puente Alto", "CDN RM San Bernardo", "CDN RM Colina", "CDN RM Talagante",
            "CDN RM Paine", "CDN Libertador Rancagua", "CDN Libertador Santa Cruz"
        ];

        const HORARIOS = [
            "08:30", "09:00", "09:30", "10:00", "10:30", "11:00",
            "11:30", "12:00", "13:00", "13:30", "14:00", "14:30",
            "15:00", "15:30", "16:00", "16:30", "17:00", "17:30"
        ];

        const DIAS = [
            { num: 4, nombre: "Lunes 4 Nov" },
            { num: 5, nombre: "Martes 5 Nov" },
            { num: 6, nombre: "Miércoles 6 Nov" },
            { num: 7, nombre: "Jueves 7 Nov" },
            { num: 8, nombre: "Viernes 8 Nov" },
            { num: 11, nombre: "Lunes 11 Nov" },
            { num: 12, nombre: "Martes 12 Nov" },
            { num: 13, nombre: "Miércoles 13 Nov" }
        ];

        // ========== INICIALIZAR FIREBASE ==========
        function initFirebase() {
            const firebaseConfig = {
                apiKey: "AIzaSyA71yIZ3DAx8dbD0PZqll0zWTPdeYjEvjo",
                authDomain: "cumbre-encadenamiento.firebaseapp.com",
                projectId: "cumbre-encadenamiento",
                storageBucket: "cumbre-encadenamiento.firebasestorage.app",
                messagingSenderId: "130375110256",
                appId: "1:130375110256:web:a45405c39732cc5788aeb5"
            };

            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                console.log("✅ Firebase iniciado");
                showMessage('empresaMessage', '✅ Sistema conectado', 'success');
            } catch (error) {
                console.error("Error Firebase:", error);
            }
        }

        // ========== FUNCIONES PRINCIPALES ==========
        function selectRole(role) {
            currentRole = role;
            document.getElementById('roleSelection').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            if (role === 'empresa') {
                showEmpresaPanel();
            } else if (role === 'cdn') {
                showCDNPanel();
            } else if (role === 'admin') {
                showAdminPanel();
            }
        }

        function volverAlRoleSelection() {
            document.getElementById('roleSelection').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('empresaPanel').classList.add('hidden');
            document.getElementById('cdnPanel').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            currentRole = null;
            selectedHorarios.clear();
        }

        function showMessage(elementId, message, type) {
            const el = document.getElementById(elementId);
            if (el) {
                el.textContent = message;
                el.className = 'message show ' + type;
                setTimeout(() => {
                    el.classList.remove('show');
                }, 5000);
            }
        }

        // ========== PANEL EMPRESA ==========
        function showEmpresaPanel() {
            document.getElementById('empresaPanel').classList.remove('hidden');
            
            const select = document.getElementById('empresaSelect');
            select.innerHTML = '<option value="">-- Selecciona una empresa --</option>';
            EMPRESAS.forEach(empresa => {
                const option = document.createElement('option');
                option.value = empresa;
                option.textContent = empresa;
                select.appendChild(option);
            });

            const horariosDiv = document.getElementById('horariosBotones');
            horariosDiv.innerHTML = '';
            HORARIOS.forEach(hora => {
                const btn = document.createElement('button');
                btn.className = 'time-btn';
                btn.textContent = hora;
                btn.type = 'button';
                btn.onclick = (e) => {
                    e.preventDefault();
                    btn.classList.toggle('selected');
                    if (btn.classList.contains('selected')) {
                        selectedHorarios.add(hora);
                    } else {
                        selectedHorarios.delete(hora);
                    }
                };
                horariosDiv.appendChild(btn);
            });
        }

        function guardarDisponibilidadEmpresa() {
            const empresa = document.getElementById('empresaSelect').value;
            const email = document.getElementById('empresaEmail').value;
            const diasSeleccionados = DIAS
                .filter(d => document.getElementById('dia' + d.num).checked)
                .map(d => d.num);

            if (!empresa || !email || diasSeleccionados.length === 0 || selectedHorarios.size === 0) {
                showMessage('empresaMessage', '❌ Completa todos los campos', 'error');
                return;
            }

            if (db) {
                db.collection('empresas').doc(empresa).set({
                    nombre: empresa,
                    email: email,
                    dias: diasSeleccionados,
                    horarios: Array.from(selectedHorarios),
                    fechaRegistro: new Date(),
                    estado: 'activo'
                }).then(() => {
                    showMessage('empresaMessage', '✅ ¡Disponibilidad guardada!', 'success');
                    limpiarFormularioEmpresa();
                }).catch(error => {
                    showMessage('empresaMessage', '❌ Error: ' + error.message, 'error');
                });
            }
        }

        function limpiarFormularioEmpresa() {
            document.getElementById('empresaSelect').value = '';
            document.getElementById('empresaEmail').value = '';
            DIAS.forEach(d => {
                const checkbox = document.getElementById('dia' + d.num);
                if (checkbox) checkbox.checked = false;
            });
            document.querySelectorAll('#horariosBotones .time-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            selectedHorarios.clear();
        }

        // ========== PANEL CDN ==========
        function showCDNPanel() {
            document.getElementById('cdnPanel').classList.remove('hidden');

            const select = document.getElementById('cdnSelect');
            select.innerHTML = '<option value="">-- Selecciona tu CDN --</option>';
            CDN.forEach(cdn => {
                const option = document.createElement('option');
                option.value = cdn;
                option.textContent = cdn;
                select.appendChild(option);
            });

            cargarEmpresasDisponiblesCDN();
        }

        function cargarEmpresasDisponiblesCDN() {
            if (!db) return;

            db.collection('empresas').get().then(snapshot => {
                const div = document.getElementById('empresasDisponibles');
                div.innerHTML = '';

                if (snapshot.empty) {
                    div.innerHTML = '<p style="color: #999;">No hay empresas registradas</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'empresa-card';
                    card.innerHTML = `
                        <strong>🏢 ${data.nombre}</strong>
                        <small>📧 ${data.email}</small>
                        <small>📅 Días: ${data.dias.join(', ')}</small>
                        <button onclick="agendarReunion('${data.nombre}', '${data.email}')">📅 Agendar</button>
                    `;
                    div.appendChild(card);
                });
            }).catch(error => {
                console.error('Error:', error);
            });
        }

        function agendarReunion(empresa, emailEmpresa) {
            const cdn = document.getElementById('cdnSelect').value;
            const emailCDN = document.getElementById('cdnEmail').value;

            if (!cdn || !emailCDN) {
                showMessage('cdnMessage', '❌ Selecciona CDN y email', 'error');
                return;
            }

            const dia = prompt('¿Día? (4-13)');
            const hora = prompt('¿Hora? (ej: 09:00)');

            if (!dia || !hora) return;

            if (db) {
                db.collection('reuniones').add({
                    empresa: empresa,
                    emailEmpresa: emailEmpresa,
                    cdn: cdn,
                    emailCDN: emailCDN,
                    dia: parseInt(dia),
                    hora: hora,
                    fechaAgendamiento: new Date(),
                    estado: 'confirmada'
                }).then(() => {
                    showMessage('cdnMessage', '✅ ¡Reunión agendada!', 'success');
                    cargarReunionesAgendadas();
                }).catch(error => {
                    showMessage('cdnMessage', '❌ Error: ' + error.message, 'error');
                });
            }
        }

        function cargarReunionesAgendadas() {
            const cdnSeleccionado = document.getElementById('cdnSelect').value;
            if (!cdnSeleccionado || !db) return;

            db.collection('reuniones').where('cdn', '==', cdnSeleccionado).get().then(snapshot => {
                const div = document.getElementById('reunionesAgendadas');
                if (snapshot.empty) {
                    div.innerHTML = '<p style="color: #999;">Sin reuniones</p>';
                    return;
                }

                let html = '<ul style="padding-left: 20px;">';
                snapshot.forEach(doc => {
                    const r = doc.data();
                    html += `<li>${r.empresa} - Nov ${r.dia} a las ${r.hora}</li>`;
                });
                html += '</ul>';
                div.innerHTML = html;
            });
        }

        // ========== PANEL ADMIN ==========
        function showAdminPanel() {
            document.getElementById('adminPanel').classList.remove('hidden');
        }

        function validarAdminPassword() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === 'admin123') {
                document.getElementById('adminDashboard').classList.remove('hidden');
                cargarDashboard();
            } else {
                showMessage('adminMessage', '❌ Contraseña incorrecta', 'error');
            }
        }

        function cargarDashboard() {
            if (!db) return;

            Promise.all([
                db.collection('empresas').get(),
                db.collection('reuniones').get()
            ]).then(([empresasSnap, reunionesSnap]) => {
                document.getElementById('totalEmpresas').textContent = empresasSnap.docs.length;
                document.getElementById('totalReuniones').textContent = reunionesSnap.docs.length;
            });
        }

        // ========== INICIALIZACIÓN ==========
        window.addEventListener('DOMContentLoaded', function() {
            initFirebase();
            console.log("✅ Sistema listo");
        });
    </script>
</body>
</html>
