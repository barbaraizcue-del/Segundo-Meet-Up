<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Segundo Meet Up - v20260929</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #667eea; padding: 15px; min-height: 100vh; }
        .container { max-width: 100%; background: white; border-radius: 10px; padding: 20px; }
        h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; background: #ddd; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 14px; }
        .tab.active { background: #667eea; color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        label { display: block; font-weight: bold; color: #333; margin: 15px 0 8px 0; }
        select, input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .btn { 
            padding: 12px; 
            border: 2px solid #ccc; 
            background: #f9f9f9; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 13px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        .btn:active, .btn:focus { 
            background: #667eea !important;
            color: white !important;
            border-color: #667eea !important;
            outline: none;
        }
        .btn.sel { 
            background: #667eea !important; 
            color: white !important; 
            border-color: #667eea !important; 
        }
        .info { background: #e3f2fd; padding: 10px; border-radius: 5px; color: #0d47a1; margin: 15px 0; font-weight: bold; }
        .resumen { background: #e8f5e9; padding: 15px; border-radius: 5px; margin: 15px 0; border-left: 4px solid #4CAF50; }
        .resumen h4 { color: #2e7d32; margin-bottom: 10px; }
        .resumen p { color: #1b5e20; margin: 5px 0; font-size: 0.9em; }
        button[type="button"] { background: #4CAF50; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin: 10px 0; font-size: 16px; }
        button[type="button"]:active { background: #388E3C; }
        .limpiar { background: #999; }
        .limpiar:active { background: #777; }
        .msg { padding: 12px; border-radius: 5px; margin: 15px 0; display: none; text-align: center; font-weight: bold; }
        .msg.success { background: #d4edda; color: #155724; display: block; }
        .msg.error { background: #f8d7da; color: #721c24; display: block; }
        h3 { color: #333; margin: 20px 0 10px 0; font-size: 16px; }
        .placeholder { color: #999; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤝 SEGUNDO MEET UP</h1>
        
        <div class="tabs">
            <button class="tab active" data-tab="0" onclick="cambiarTab(0)">🏢 EMP</button>
            <button class="tab" data-tab="1" onclick="cambiarTab(1)">👥 CDN</button>
            <button class="tab" data-tab="2" onclick="cambiarTab(2)">🔐 ADM</button>
        </div>

        <div id="p0" class="panel active">
            <h2 style="color: #667eea; margin-bottom: 20px;">Registrar Disponibilidad</h2>
            <div id="msg" class="msg"></div>

            <label>🏢 Empresa:</label>
            <select id="empresa">
                <option value="">-- Selecciona --</option>
                <option>Abastible</option><option>Aeropuerto</option><option>Agrosuper</option>
                <option>Andina</option><option>Angloamérica</option><option>Antofagasta Minerals</option>
                <option>Aramark</option><option>BCI</option><option>BHP</option><option>Cencosud</option>
                <option>Chilecompra</option><option>CMPC</option><option>Empresa Arauco</option>
                <option>Enel</option><option>Enex</option><option>Lipigas</option>
                <option>Lokal Shop</option><option>Mall Plaza</option><option>Mercado Libre</option>
                <option>Metro</option><option>Simón de Cirene</option><option>SMU</option>
                <option>Sopraval</option><option>Sura</option><option>Viña Chocalán</option><option>Walmart</option>
            </select>

            <label>📧 Email:</label>
            <input type="email" id="email" placeholder="contacto@empresa.com">

            <h3>📅 Fechas Noviembre:</h3>
            <div class="grid" id="fechas"></div>
            <div class="info" id="cFechas">0 fechas</div>

            <h3>🕐 Horarios:</h3>
            <div class="grid" id="horarios"></div>
            <div class="info" id="cHorarios">0 horarios</div>

            <div class="resumen">
                <h4>✅ Resumen:</h4>
                <div id="resumen"><p style="color: #999;">Completa campos</p></div>
            </div>

            <button type="button" onclick="guardar()">💾 GUARDAR</button>
            <button type="button" class="limpiar" onclick="limpiar()">🔄 Limpiar</button>
        </div>

        <div id="p1" class="panel"><h2>Agendar</h2><p>En desarrollo...</p></div>
        <div id="p2" class="panel"><h2>Admin</h2><p>En desarrollo...</p></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA71yIZ3DAx8dbD0PZqll0zWTPdeYjEvjo",
            authDomain: "cumbre-encadenamiento.firebaseapp.com",
            projectId: "cumbre-encadenamiento",
            storageBucket: "cumbre-encadenamiento.firebasestorage.app",
            messagingSenderId: "130375110256",
            appId: "1:130375110256:web:a45405c39732cc5788aeb5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const FECHAS = ["2-11", "3-11", "4-11", "5-11", "6-11", "9-11", "10-11", "11-11", "12-11", "13-11", "16-11", "17-11", "18-11", "19-11", "20-11", "23-11", "24-11", "25-11", "26-11", "27-11", "30-11"];
        const DIAS = ["Lun 2", "Mar 3", "Mié 4", "Jue 5", "Vie 6", "Lun 9", "Mar 10", "Mié 11", "Jue 12", "Vie 13", "Lun 16", "Mar 17", "Mié 18", "Jue 19", "Vie 20", "Lun 23", "Mar 24", "Mié 25", "Jue 26", "Vie 27", "Lun 30"];
        const HORAS = ["08:30-09:30", "09:30-10:30", "10:30-11:30", "11:30-12:30", "12:30-13:30", "13:30-14:30", "14:30-15:30", "15:30-16:30", "16:30-17:30", "17:30-18:30"];
        const HORAS_TEXT = ["08:30", "09:30", "10:30", "11:30", "12:30", "13:30", "14:30", "15:30", "16:30", "17:30"];

        let fechasSeleccionadas = [];
        let horariosSeleccionados = [];

        function init() {
            // Crear botones de fechas
            const fechasDiv = document.getElementById('fechas');
            FECHAS.forEach((f, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.type = 'button';
                btn.textContent = DIAS[i];
                btn.dataset.fecha = f;
                btn.onclick = () => toggleFecha(btn, f);
                fechasDiv.appendChild(btn);
            });

            // Crear botones de horarios
            const horariosDiv = document.getElementById('horarios');
            HORAS.forEach((h, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.type = 'button';
                btn.textContent = HORAS_TEXT[i];
                btn.dataset.hora = h;
                btn.onclick = () => toggleHora(btn, h);
                horariosDiv.appendChild(btn);
            });
        }

        function cambiarTab(n) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('p' + n).classList.add('active');
            document.querySelector('[data-tab="' + n + '"]').classList.add('active');
        }

        function toggleFecha(btn, fecha) {
            btn.classList.toggle('sel');
            const idx = fechasSeleccionadas.indexOf(fecha);
            if (idx >= 0) {
                fechasSeleccionadas.splice(idx, 1);
            } else {
                fechasSeleccionadas.push(fecha);
            }
            document.getElementById('cFechas').innerText = fechasSeleccionadas.length + ' fecha(s)';
            actualizar();
        }

        function toggleHora(btn, hora) {
            btn.classList.toggle('sel');
            const idx = horariosSeleccionados.indexOf(hora);
            if (idx >= 0) {
                horariosSeleccionados.splice(idx, 1);
            } else {
                horariosSeleccionados.push(hora);
            }
            document.getElementById('cHorarios').innerText = horariosSeleccionados.length + ' horario(s)';
            actualizar();
        }

        function actualizar() {
            const emp = document.getElementById('empresa').value;
            const mail = document.getElementById('email').value;
            const div = document.getElementById('resumen');

            if (!emp || !mail || fechasSeleccionadas.length === 0 || horariosSeleccionados.length === 0) {
                div.innerHTML = '<p style="color: #999;">Completa todos los campos</p>';
                return;
            }

            let html = '<p><strong>' + emp + '</strong></p>';
            html += '<p>' + mail + '</p>';
            html += '<p style="margin-top: 10px;">📅 ' + fechasSeleccionadas.length + ' fecha(s) | 🕐 ' + horariosSeleccionados.length + ' horario(s)</p>';
            html += '<p style="font-size: 0.8em; margin-top: 8px; color: #666;">Total: ' + (fechasSeleccionadas.length * horariosSeleccionados.length) + ' espacios</p>';
            div.innerHTML = html;
        }

        async function guardar() {
            const emp = document.getElementById('empresa').value;
            const mail = document.getElementById('email').value;

            if (!emp || !mail || fechasSeleccionadas.length === 0 || horariosSeleccionados.length === 0) {
                mostrar('❌ Completa todos los campos', 'error');
                return;
            }

            try {
                const disp = [];
                fechasSeleccionadas.forEach(f => {
                    horariosSeleccionados.forEach(h => {
                        disp.push({ fecha: f + '-2026', horario: h });
                    });
                });

                await db.collection('empresas').doc(emp).set({
                    nombre: emp,
                    email: mail,
                    disponibilidad: disp,
                    fechaRegistro: new Date().toISOString()
                });

                mostrar('✅ ' + emp + ' guardada', 'success');
                setTimeout(() => limpiar(), 2000);
            } catch (e) {
                mostrar('❌ ' + e.message, 'error');
            }
        }

        function limpiar() {
            fechasSeleccionadas = [];
            horariosSeleccionados = [];
            document.getElementById('empresa').value = '';
            document.getElementById('email').value = '';
            document.querySelectorAll('.btn.sel').forEach(b => b.classList.remove('sel'));
            document.getElementById('cFechas').innerText = '0 fechas';
            document.getElementById('cHorarios').innerText = '0 horarios';
            actualizar();
        }

        function mostrar(txt, tipo) {
            const m = document.getElementById('msg');
            m.innerText = txt;
            m.className = 'msg ' + tipo;
            setTimeout(() => { m.className = 'msg'; }, 4000);
        }

        // Inicializar al cargar
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
