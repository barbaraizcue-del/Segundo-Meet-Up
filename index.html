<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sistema Agendamiento - Cumbre</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px;
            min-height: 100vh;
        }
        .app { max-width: 100%; background: white; border-radius: 12px; padding: 16px; min-height: 100vh; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: #667eea; font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 12px; }
        .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .tab-btn {
            padding: 12px;
            border: none;
            background: #eee;
            color: #666;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .content { display: none; }
        .content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; font-size: 14px; }
        input, select, textarea { 
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

        .fecha-card {
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .fecha-card.active {
            background: #e3f2fd;
            border-color: #667eea;
        }
        .fecha-card h4 { color: #667eea; margin-bottom: 8px; font-size: 14px; }
        .fecha-card .grid-3 { gap: 4px; }

        .hora-btn { 
            padding: 8px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hora-btn:active, .hora-btn.sel {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-primary:active { background: #388E3C; }

        .info-box {
            background: #e8f5e9;
            border-left: 4px solid #4CAF50;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 13px;
            color: #1b5e20;
        }

        .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 6px; margin-bottom: 12px; display: none; }
        .success.show { display: block; }
        .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 6px; margin-bottom: 12px; display: none; }
        .error.show { display: block; }

        .section-title { font-size: 16px; font-weight: bold; color: #333; margin: 16px 0 12px 0; }

        .reunion-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
            font-size: 12px;
        }
        .reunion-item p { margin: 4px 0; }
        .reunion-item strong { color: #667eea; }

        .disponibilidad-resumen {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>📅 AGENDAMIENTO</h1>
            <p class="subtitle">Cumbre Encadenamiento Noviembre 2026</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarTab('empresa')">🏢 EMPRESA</button>
            <button class="tab-btn" onclick="cambiarTab('cdn')">👥 CDN</button>
            <button class="tab-btn" onclick="cambiarTab('ver')">👁️ VER</button>
        </div>

        <!-- PANEL EMPRESA -->
        <div id="empresa" class="content active">
            <div class="success" id="msg-emp"></div>

            <div class="form-group">
                <label>🏢 Selecciona Empresa:</label>
                <select id="emp-select">
                    <option value="">-- Elige una --</option>
                    <option>Abastible</option><option>Aeropuerto</option><option>Agrosuper</option>
                    <option>Andina</option><option>Angloamérica</option><option>Antofagasta Minerals</option>
                    <option>Aramark</option><option>BCI</option><option>BHP</option><option>Cencosud</option>
                    <option>Chilecompra</option><option>CMPC</option><option>Empresa Arauco</option>
                    <option>Enel</option><option>Enex</option><option>Lipigas</option>
                    <option>Lokal Shop</option><option>Mall Plaza</option><option>Mercado Libre</option>
                    <option>Metro</option><option>Simón de Cirene</option><option>SMU</option>
                    <option>Sopraval</option><option>Sura</option><option>Viña Chocalán</option><option>Walmart</option>
                </select>
            </div>

            <div class="form-group">
                <label>📧 Email de Contacto:</label>
                <input type="email" id="emp-email" placeholder="contacto@empresa.com">
            </div>

            <p class="section-title">📅 Selecciona Día y sus Horarios Disponibles:</p>
            <div id="fechas-container"></div>

            <div class="disponibilidad-resumen" id="resumen-emp">Selecciona horarios para guardar</div>

            <button class="btn-primary" onclick="guardarEmpresa()">💾 REGISTRAR DISPONIBILIDAD</button>
        </div>

        <!-- PANEL CDN -->
        <div id="cdn" class="content">
            <div class="success" id="msg-cdn"></div>

            <div class="form-group">
                <label>🏢 CDN:</label>
                <select id="cdn-select">
                    <option value="">-- Elige una --</option>
                    <option>CDN Arica y Parinacota</option>
                    <option>CDN Tarapacá</option>
                    <option>CDN Antofagasta</option>
                    <option>CDN Atacama</option>
                    <option>CDN Coquimbo</option>
                    <option>CDN Valparaíso</option>
                    <option>CDN RM Providencia</option>
                    <option>CDN RM Santiago Centro</option>
                    <option>CDN RM La Florida</option>
                    <option>CDN RM Maipú</option>
                    <option>CDN RM Ñuñoa</option>
                    <option>CDN RM Estación Central</option>
                    <option>CDN RM Puente Alto</option>
                    <option>CDN RM San Bernardo</option>
                    <option>CDN RM Colina</option>
                    <option>CDN RM Talagante</option>
                    <option>CDN RM Paine</option>
                    <option>CDN Libertador Rancagua</option>
                    <option>CDN Libertador Santa Cruz</option>
                </select>
            </div>

            <div class="form-group">
                <label>📧 Email del Contacto:</label>
                <input type="email" id="cdn-email" placeholder="contacto@cdn.com">
            </div>

            <div class="form-group">
                <label>🏢 Empresa Deseada:</label>
                <select id="cdn-empresa">
                    <option value="">-- Selecciona --</option>
                    <option>Abastible</option><option>Aeropuerto</option><option>Agrosuper</option>
                    <option>Andina</option><option>Angloamérica</option><option>Antofagasta Minerals</option>
                    <option>Aramark</option><option>BCI</option><option>BHP</option><option>Cencosud</option>
                    <option>Chilecompra</option><option>CMPC</option><option>Empresa Arauco</option>
                    <option>Enel</option><option>Enex</option><option>Lipigas</option>
                    <option>Lokal Shop</option><option>Mall Plaza</option><option>Mercado Libre</option>
                    <option>Metro</option><option>Simón de Cirene</option><option>SMU</option>
                    <option>Sopraval</option><option>Sura</option><option>Viña Chocalán</option><option>Walmart</option>
                </select>
            </div>

            <p class="section-title">📅 Elige Día y Horario Disponible:</p>
            <div id="disponibilidades-cdn"></div>

            <div class="info-box" id="info-cdn">Cargando disponibilidades...</div>

            <button class="btn-primary" onclick="agendarCDN()">📅 AGENDAR REUNIÓN</button>
        </div>

        <!-- PANEL VER -->
        <div id="ver" class="content">
            <p class="section-title">📋 Todas las Reuniones Agendadas:</p>
            <div id="reuniones-tabla"></div>
            <button class="btn-primary" onclick="recargarReuniones()" style="background: #2196F3;">🔄 ACTUALIZAR</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA71yIZ3DAx8dbD0PZqll0zWTPdeYjEvjo",
            authDomain: "cumbre-encadenamiento.firebaseapp.com",
            projectId: "cumbre-encadenamiento",
            storageBucket: "cumbre-encadenamiento.firebasestorage.app",
            messagingSenderId: "130375110256",
            appId: "1:130375110256:web:a45405c39732cc5788aeb5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const FECHAS = [
            {num: 2, dia: 'Lun 2'}, {num: 3, dia: 'Mar 3'}, {num: 4, dia: 'Mié 4'},
            {num: 5, dia: 'Jue 5'}, {num: 6, dia: 'Vie 6'}, {num: 9, dia: 'Lun 9'},
            {num: 10, dia: 'Mar 10'}, {num: 11, dia: 'Mié 11'}, {num: 12, dia: 'Jue 12'},
            {num: 13, dia: 'Vie 13'}, {num: 16, dia: 'Lun 16'}, {num: 17, dia: 'Mar 17'},
            {num: 18, dia: 'Mié 18'}, {num: 19, dia: 'Jue 19'}, {num: 20, dia: 'Vie 20'},
            {num: 23, dia: 'Lun 23'}, {num: 24, dia: 'Mar 24'}, {num: 25, dia: 'Mié 25'},
            {num: 26, dia: 'Jue 26'}, {num: 27, dia: 'Vie 27'}, {num: 30, dia: 'Lun 30'}
        ];

        const HORAS = [
            '08:30-09:30', '09:30-10:30', '10:30-11:30', '11:30-12:30',
            '12:30-13:30', '13:30-14:30', '14:30-15:30', '15:30-16:30',
            '16:30-17:30', '17:30-18:30'
        ];

        let disponibilidadEmpresa = {}; // {fecha: [horas]}
        let fechaSelCdn = null;
        let horaSelCdn = null;

        function init() {
            // Crear cards de fechas para EMPRESA
            const cont = document.getElementById('fechas-container');
            FECHAS.forEach(f => {
                const card = document.createElement('div');
                card.className = 'fecha-card';
                card.id = 'fecha-card-' + f.num;
                
                let horasHtml = '';
                HORAS.forEach(h => {
                    horasHtml += '<button type="button" class="hora-btn" data-hora="' + h + '" onclick="toggleHoraEmp(event, ' + f.num + ', \'' + h + '\')">'+h.split('-')[0]+'</button>';
                });
                
                card.innerHTML = '<h4>' + f.dia + ' Nov</h4><div class="grid-3">' + horasHtml + '</div>';
                cont.appendChild(card);
            });

            cargarDisponibilidades();
        }

        function cambiarTab(tab) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'cdn') {
                cargarDisponibilidades();
            }
            if (tab === 'ver') {
                recargarReuniones();
            }
        }

        function toggleHoraEmp(e, fecha, hora) {
            e.target.classList.toggle('sel');
            
            if (!disponibilidadEmpresa[fecha]) {
                disponibilidadEmpresa[fecha] = [];
            }
            
            const idx = disponibilidadEmpresa[fecha].indexOf(hora);
            if (idx >= 0) {
                disponibilidadEmpresa[fecha].splice(idx, 1);
            } else {
                disponibilidadEmpresa[fecha].push(hora);
            }
            
            actualizarResumenEmp();
        }

        function actualizarResumenEmp() {
            let total = 0;
            let resumen = '<strong>Disponibilidad por día:</strong><br>';
            
            FECHAS.forEach(f => {
                if (disponibilidadEmpresa[f.num] && disponibilidadEmpresa[f.num].length > 0) {
                    resumen += f.dia + ': ' + disponibilidadEmpresa[f.num].length + ' hora(s)<br>';
                    total += disponibilidadEmpresa[f.num].length;
                }
            });
            
            if (total === 0) {
                resumen = 'Selecciona horarios para guardar';
            }
            
            document.getElementById('resumen-emp').innerHTML = resumen;
        }

        async function guardarEmpresa() {
            const emp = document.getElementById('emp-select').value;
            const email = document.getElementById('emp-email').value;

            if (!emp || !email) {
                mostrarMsg('msg-emp', '❌ Completa empresa y email', false);
                return;
            }

            let total = 0;
            for (let fecha in disponibilidadEmpresa) {
                total += disponibilidadEmpresa[fecha].length;
            }

            if (total === 0) {
                mostrarMsg('msg-emp', '❌ Selecciona al menos un horario', false);
                return;
            }

            try {
                await db.collection('empresas').doc(emp).set({
                    nombre: emp,
                    email: email,
                    disponibilidad: disponibilidadEmpresa,
                    fechaRegistro: new Date()
                });

                mostrarMsg('msg-emp', '✅ ' + emp + ' registrada - ' + total + ' espacios', true);
                setTimeout(() => {
                    document.getElementById('emp-select').value = '';
                    document.getElementById('emp-email').value = '';
                    disponibilidadEmpresa = {};
                    document.querySelectorAll('.hora-btn.sel').forEach(b => b.classList.remove('sel'));
                    actualizarResumenEmp();
                }, 1500);
            } catch (e) {
                mostrarMsg('msg-emp', '❌ Error: ' + e.message, false);
            }
        }

        async function cargarDisponibilidades() {
            try {
                const snap = await db.collection('empresas').get();
                const cont = document.getElementById('disponibilidades-cdn');
                let html = '';

                if (snap.empty) {
                    html = '<p style="color: #999;">No hay empresas con disponibilidad aún</p>';
                } else {
                    snap.forEach(doc => {
                        const data = doc.data();
                        html += '<div style="background:#f5f5f5; padding:12px; border-radius:6px; margin-bottom:12px;">';
                        html += '<strong style="color:#667eea;">' + data.nombre + '</strong><br>';
                        
                        for (let fecha in data.disponibilidad) {
                            const fechaNombre = FECHAS.find(f => f.num == fecha)?.dia || 'Día '+fecha;
                            const horas = data.disponibilidad[fecha];
                            html += '<div style="margin-top:8px; font-size:12px;">';
                            html += '<strong>' + fechaNombre + ':</strong> ';
                            horas.forEach(h => {
                                html += '<button type="button" class="hora-btn" style="margin:2px;" onclick="seleccionarHoraCdn(' + fecha + ', \'' + h + '\', \'' + data.nombre + '\', \'' + data.email + '\')">' + h.split('-')[0] + '</button>';
                            });
                            html += '</div>';
                        }
                        html += '</div>';
                    });
                }

                cont.innerHTML = html;
            } catch (e) {
                document.getElementById('disponibilidades-cdn').innerHTML = '<p style="color:#f44336;">Error: ' + e.message + '</p>';
            }
        }

        function seleccionarHoraCdn(fecha, hora, empresa, emailEmpresa) {
            fechaSelCdn = fecha;
            horaSelCdn = hora;
            document.getElementById('cdn-empresa').value = empresa;
            document.getElementById('info-cdn').innerHTML = '✓ <strong>' + empresa + '</strong><br>' + FECHAS.find(f => f.num == fecha).dia + ' a las ' + hora;
        }

        async function agendarCDN() {
            const cdn = document.getElementById('cdn-select').value;
            const email = document.getElementById('cdn-email').value;
            const emp = document.getElementById('cdn-empresa').value;

            if (!cdn || !email || !emp || !fechaSelCdn || !horaSelCdn) {
                mostrarMsg('msg-cdn', '❌ Selecciona empresa, fecha y horario', false);
                return;
            }

            try {
                // Obtener email de la empresa
                const empSnap = await db.collection('empresas').doc(emp).get();
                const emailEmp = empSnap.data()?.email || '';

                // Crear evento en Google Calendar (requiere API key)
                const evento = {
                    titulo: 'Reunión: ' + cdn + ' ↔ ' + emp,
                    fecha: '2026-11-' + String(fechaSelCdn).padStart(2, '0'),
                    hora: horaSelCdn.split('-')[0],
                    emailCdn: email,
                    emailEmp: emailEmp,
                    cdn: cdn,
                    empresa: emp
                };

                // Guardar en Firebase
                await db.collection('reuniones').add({
                    cdn: cdn,
                    emailCdn: email,
                    empresa: emp,
                    emailEmpresa: emailEmp,
                    fecha: fechaSelCdn,
                    horario: horaSelCdn,
                    fechaCreacion: new Date(),
                    evento: evento
                });

                mostrarMsg('msg-cdn', '✅ Reunión agendada con ' + emp, true);
                
                setTimeout(() => {
                    document.getElementById('cdn-select').value = '';
                    document.getElementById('cdn-email').value = '';
                    document.getElementById('cdn-empresa').value = '';
                    fechaSelCdn = null;
                    horaSelCdn = null;
                    document.getElementById('info-cdn').innerHTML = 'Cargando disponibilidades...';
                    cargarDisponibilidades();
                }, 1500);
            } catch (e) {
                mostrarMsg('msg-cdn', '❌ Error: ' + e.message, false);
            }
        }

        async function recargarReuniones() {
            try {
                const snap = await db.collection('reuniones').orderBy('fechaCreacion', 'desc').limit(50).get();
                let html = '';
                
                if (snap.empty) {
                    html = '<p style="color: #999; text-align: center;">No hay reuniones agendadas</p>';
                } else {
                    snap.forEach(doc => {
                        const d = doc.data();
                        const fechaNombre = FECHAS.find(f => f.num == d.fecha)?.dia || 'Día '+d.fecha;
                        html += '<div class="reunion-item">';
                        html += '<p><strong>📅</strong> ' + fechaNombre + ' Nov | <strong>⏰</strong> ' + d.horario + '</p>';
                        html += '<p><strong>👥 CDN:</strong> ' + d.cdn + ' (' + d.emailCdn + ')</p>';
                        html += '<p><strong>🏢 EMPRESA:</strong> ' + d.empresa + ' (' + d.emailEmpresa + ')</p>';
                        html += '</div>';
                    });
                }
                
                document.getElementById('reuniones-tabla').innerHTML = html;
            } catch (e) {
                document.getElementById('reuniones-tabla').innerHTML = '<p style="color: #f44336;">Error: ' + e.message + '</p>';
            }
        }

        function mostrarMsg(id, txt, success) {
            const el = document.getElementById(id);
            el.textContent = txt;
            el.className = success ? 'success show' : 'error show';
            setTimeout(() => el.className = success ? 'success' : 'error', 3000);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
