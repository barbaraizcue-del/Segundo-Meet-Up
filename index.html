<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamiento - Cumbre</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif;
            background: #667eea;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        h1 { color: #667eea; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #388E3C; }
        .message { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .empresas-list { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        .empresa-item { padding: 10px; background: white; margin: 5px 0; border-left: 3px solid #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Agendamiento Cumbre</h1>
        
        <div id="mensaje"></div>

        <h2>Registrar Disponibilidad</h2>
        <div class="form-group">
            <label>Empresa:</label>
            <select id="empresa">
                <option value="">-- Selecciona --</option>
                <option>BHP</option>
                <option>Walmart</option>
                <option>Agrosuper</option>
            </select>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email">
        </div>

        <div class="form-group">
            <label>Horario (ej: 08:30-09:30):</label>
            <input type="text" id="horario">
        </div>

        <button onclick="guardar()">Guardar</button>

        <div class="empresas-list">
            <h3>Empresas Registradas:</h3>
            <div id="lista"></div>
        </div>
    </div>

    <script>
        function guardar() {
            const empresa = document.getElementById('empresa').value;
            const email = document.getElementById('email').value;
            const horario = document.getElementById('horario').value;

            if (!empresa || !email || !horario) {
                mostrarMensaje('Completa todos los campos', false);
                return;
            }

            // Guardar en localStorage
            let datos = JSON.parse(localStorage.getItem('empresas') || '{}');
            if (!datos[empresa]) {
                datos[empresa] = { email: email, horarios: [] };
            }
            datos[empresa].horarios.push(horario);
            localStorage.setItem('empresas', JSON.stringify(datos));

            mostrarMensaje('✅ Guardado correctamente', true);
            listar();
        }

        function listar() {
            const datos = JSON.parse(localStorage.getItem('empresas') || '{}');
            let html = '';
            for (let emp in datos) {
                html += '<div class="empresa-item"><strong>' + emp + '</strong> (' + datos[emp].email + ')<br>Horarios: ' + datos[emp].horarios.join(', ') + '</div>';
            }
            document.getElementById('lista').innerHTML = html || '<p>Sin registros</p>';
        }

        function mostrarMensaje(msg, success) {
            const el = document.getElementById('mensaje');
            el.textContent = msg;
            el.className = 'message ' + (success ? 'success' : 'error');
        }

        listar();
    </script>
</body>
</html>
