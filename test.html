<!DOCTYPE html>
<html>
<head>
    <title>Test Firebase</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .box { background: white; padding: 20px; margin: 10px 0; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #667eea; color: white; border: none; border-radius: 5px; }
        .log { background: #000; color: #0f0; padding: 10px; font-family: monospace; margin: 10px 0; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🔧 Test Firebase</h1>
    
    <div class="box">
        <h2>1️⃣ Guardar Empresa</h2>
        <input type="text" id="empresaTest" placeholder="Nombre empresa" value="BHP">
        <input type="email" id="emailTest" placeholder="Email" value="bhp@test.com">
        <button onclick="guardarTest()">GUARDAR TEST</button>
    </div>

    <div class="box">
        <h2>2️⃣ Cargar Empresas</h2>
        <button onclick="cargarTest()">CARGAR EMPRESAS</button>
    </div>

    <div class="box">
        <h2>📋 Console Log</h2>
        <div class="log" id="logBox"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA71yIZ3DAx8dbD0PZqll0zWTPdeYjEvjo",
            authDomain: "cumbre-encadenamiento.firebaseapp.com",
            projectId: "cumbre-encadenamiento",
            storageBucket: "cumbre-encadenamiento.firebasestorage.app",
            messagingSenderId: "130375110256",
            appId: "1:130375110256:web:a45405c39732cc5788aeb5"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);

        const logBox = document.getElementById('logBox');

        function log(msg) {
            const timestamp = new Date().toLocaleTimeString();
            const text = `[${timestamp}] ${msg}`;
            console.log(text);
            logBox.innerHTML += text + '\n';
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function guardarTest() {
            const empresa = document.getElementById('empresaTest').value;
            const email = document.getElementById('emailTest').value;

            if (!empresa || !email) {
                log('❌ Faltan datos');
                return;
            }

            log(`⏳ Guardando ${empresa}...`);

            try {
                await db.collection('empresas').doc(empresa).set({
                    nombre: empresa,
                    email: email,
                    disponibilidad: [
                        { dia: 4, horario: "09:00" },
                        { dia: 5, horario: "14:00" }
                    ],
                    fechaRegistro: new Date(),
                    actualizado: new Date()
                });

                log(`✅ ${empresa} GUARDADA EN FIREBASE`);
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        }

        async function cargarTest() {
            log('⏳ Cargando empresas...');

            try {
                const snapshot = await db.collection('empresas').get();
                
                log(`📊 Total de documentos: ${snapshot.size}`);

                if (snapshot.empty) {
                    log('❌ NO HAY EMPRESAS EN FIRESTORE');
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    log(`✅ Empresa: ${data.nombre}`);
                    log(`   Email: ${data.email}`);
                    log(`   Disponibilidades: ${JSON.stringify(data.disponibilidad)}`);
                });

            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        }

        log('✅ Firebase inicializado');
    </script>
</body>
</html>
