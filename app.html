<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamiento Simple</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f5f5f5; 
            padding: 20px; 
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
        }
        h1 { color: #333; margin-bottom: 30px; }
        h2 { color: #666; margin-top: 30px; margin-bottom: 15px; font-size: 18px; }
        
        .form-group { 
            margin-bottom: 25px; 
        }
        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 8px; 
            color: #333;
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #ddd; 
            border-radius: 4px; 
            font-size: 16px;
        }
        input:focus, select:focus { 
            outline: none; 
            border-color: #0066cc;
        }
        
        .botones-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .boton {
            padding: 15px;
            background: #e8f4f8;
            border: 2px solid #0066cc;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #0066cc;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .boton:hover {
            background: #cce5f9;
        }
        
        .boton.activo {
            background: #0066cc;
            color: white;
        }
        
        .guardar {
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 30px;
        }
        
        .guardar:hover {
            background: #218838;
        }
        
        .info-box {
            background: #e7f5e7;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        
        .info-box strong {
            color: #155724;
        }
        
        .info-box ul {
            margin-left: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Agendamiento Cumbre Encadenamiento</h1>
        
        <div class="form-group">
            <label>🏢 Selecciona tu Empresa:</label>
            <select id="empresa">
                <option value="">-- Selecciona una empresa --</option>
                <option value="BHP">BHP</option>
                <option value="Walmart">Walmart</option>
                <option value="Enel">Enel</option>
                <option value="Agrosuper">Agrosuper</option>
                <option value="Arauco">Arauco</option>
            </select>
        </div>

        <div class="form-group">
            <label>📧 Email de Contacto:</label>
            <input type="email" id="email" placeholder="contacto@empresa.com">
        </div>

        <!-- SECCIÓN DE FECHAS -->
        <div id="seccion-fechas" style="display: none;">
            <h2>📅 Selecciona tus fechas disponibles:</h2>
            <div class="botones-container" id="grid-fechas"></div>
        </div>

        <!-- SECCIÓN DE HORARIOS -->
        <div id="seccion-horarios" style="display: none;">
            <h2 id="titulo-horarios">🕐 Horarios disponibles:</h2>
            <div class="botones-container" id="grid-horarios"></div>
        </div>

        <!-- INFO -->
        <div id="info-resumen" class="info-box" style="display: none;">
            <strong>✅ Tu selección:</strong>
            <div id="texto-resumen" style="margin-top: 10px;"></div>
        </div>

        <button class="guardar" onclick="guardarDatos()">💾 GUARDAR DISPONIBILIDAD</button>

        <!-- SEPARADOR DE PANELES -->
        <hr style="margin: 60px 0; border: 2px solid #ddd;">

        <!-- ===== PANEL CDN ===== -->
        <h1>👥 PANEL CDN - AGENDAR REUNIÓN</h1>
        
        <div class="form-group">
            <label>👥 Selecciona tu CDN:</label>
            <select id="cdn-select">
                <option value="">-- Selecciona un CDN --</option>
                <option value="CDN RM Providencia">CDN RM Providencia</option>
                <option value="CDN RM Santiago Centro">CDN RM Santiago Centro</option>
                <option value="CDN RM La Florida">CDN RM La Florida</option>
                <option value="CDN RM Maipú">CDN RM Maipú</option>
                <option value="CDN RM Ñuñoa">CDN RM Ñuñoa</option>
                <option value="CDN RM Estación Central">CDN RM Estación Central</option>
                <option value="CDN RM Puente Alto">CDN RM Puente Alto</option>
                <option value="CDN RM San Bernardo">CDN RM San Bernardo</option>
                <option value="CDN RM Colina">CDN RM Colina</option>
                <option value="CDN RM Talagante">CDN RM Talagante</option>
                <option value="CDN Arica y Parinacota">CDN Arica y Parinacota</option>
                <option value="CDN Tarapacá">CDN Tarapacá</option>
                <option value="CDN Antofagasta">CDN Antofagasta</option>
                <option value="CDN Atacama">CDN Atacama</option>
                <option value="CDN Coquimbo">CDN Coquimbo</option>
                <option value="CDN Valparaíso">CDN Valparaíso</option>
                <option value="CDN Libertador Rancagua">CDN Libertador Rancagua</option>
                <option value="CDN Libertador Santa Cruz">CDN Libertador Santa Cruz</option>
            </select>
        </div>

        <div class="form-group">
            <label>📧 Email del CDN:</label>
            <input type="email" id="cdn-email" placeholder="contacto@cdn.com">
        </div>

        <div class="form-group">
            <label>🏢 Selecciona Empresa:</label>
            <select id="empresa-cdn-select" onchange="cargarHorariosCDN()">
                <option value="">-- Selecciona una empresa --</option>
            </select>
        </div>

        <!-- HORARIOS DISPONIBLES DE LA EMPRESA -->
        <div id="seccion-horarios-cdn" style="display: none;">
            <h2>🕐 Horarios disponibles de la empresa:</h2>
            <div class="botones-container" id="grid-horarios-cdn"></div>
            <button class="guardar" onclick="agendarReunion()" style="background: #ff9800; margin-top: 30px;">📅 AGENDAR REUNIÓN</button>
        </div>

        <!-- CONFIRMACIÓN -->
        <div id="confirmacion-cdn" class="info-box" style="display: none;">
            <strong>✅ Reunión agendada correctamente!</strong>
            <div id="texto-confirmacion" style="margin-top: 10px;"></div>
        </div>

        <!-- SEPARADOR DE PANELES -->
        <hr style="margin: 60px 0; border: 2px solid #ddd;">

        <!-- ===== PANEL VER REUNIONES ===== -->
        <h1>👁️ VER TODAS LAS REUNIONES AGENDADAS</h1>
        
        <button class="guardar" onclick="refrescarReuniones()" style="background: #2196F3; margin-bottom: 30px;">🔄 ACTUALIZAR LISTA</button>
        
        <div id="lista-reuniones-container">
            <div id="lista-reuniones" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        // DATOS
        const FECHAS = [
            {num: 4, texto: 'Lun 4'}, {num: 5, texto: 'Mar 5'}, {num: 6, texto: 'Mié 6'}, {num: 7, texto: 'Jue 7'}, {num: 8, texto: 'Vie 8'},
            {num: 11, texto: 'Lun 11'}, {num: 12, texto: 'Mar 12'}, {num: 13, texto: 'Mié 13'}, {num: 14, texto: 'Jue 14'}, {num: 15, texto: 'Vie 15'},
            {num: 18, texto: 'Lun 18'}, {num: 19, texto: 'Mar 19'}, {num: 20, texto: 'Mié 20'}, {num: 21, texto: 'Jue 21'}, {num: 22, texto: 'Vie 22'},
            {num: 25, texto: 'Lun 25'}, {num: 26, texto: 'Mar 26'}, {num: 27, texto: 'Mié 27'}, {num: 28, texto: 'Jue 28'}, {num: 29, texto: 'Vie 29'}
        ];

        const HORARIOS = ['08:30', '09:30', '10:30', '11:30', '12:30', '13:30', '14:30', '15:30', '16:30', '17:30'];

        // ESTADO
        let fechasSeleccionadas = [];
        let horariosSeleccionados = {};

        // EVENT LISTENERS - Agregar cuando se carga la página
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('empresa').addEventListener('change', mostrarFechas);
            document.getElementById('email').addEventListener('input', mostrarFechas);
        });

        // FUNCIÓN: Mostrar fechas
        function mostrarFechas() {
            const empresa = document.getElementById('empresa').value;
            const email = document.getElementById('email').value;

            console.log('→ mostrarFechas() llamado. Empresa:', empresa, 'Email:', email);

            if (!empresa || !email) {
                console.log('→ No hay empresa o email. Ocultando fechas.');
                document.getElementById('seccion-fechas').style.display = 'none';
                return;
            }

            console.log('→ Mostrando sección de fechas...');
            document.getElementById('seccion-fechas').style.display = 'block';

            const grid = document.getElementById('grid-fechas');
            grid.innerHTML = '';

            FECHAS.forEach(fecha => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'boton';
                btn.textContent = fecha.texto;
                btn.id = 'btn-fecha-' + fecha.num;
                btn.onclick = function(e) {
                    e.preventDefault();
                    seleccionarFecha(fecha.num, fecha.texto);
                };
                grid.appendChild(btn);
            });

            console.log('→ Botones de fecha creados:', FECHAS.length);
        }

        // FUNCIÓN: Seleccionar fecha
        function seleccionarFecha(num, texto) {
            console.log('→ seleccionarFecha() llamado. Num:', num, 'Texto:', texto);

            const btn = document.getElementById('btn-fecha-' + num);
            btn.classList.toggle('activo');

            const idx = fechasSeleccionadas.indexOf(num);
            if (idx >= 0) {
                console.log('→ Fecha ya estaba seleccionada. Deseleccionando...');
                fechasSeleccionadas.splice(idx, 1);
                delete horariosSeleccionados[num];
            } else {
                console.log('→ Seleccionando fecha nueva...');
                fechasSeleccionadas.push(num);
                horariosSeleccionados[num] = [];
                mostrarHorarios(num, texto);
            }

            actualizarResumen();
        }

        // FUNCIÓN: Mostrar horarios
        function mostrarHorarios(numFecha, textoFecha) {
            console.log('→ mostrarHorarios() llamado. Fecha:', textoFecha);

            document.getElementById('titulo-horarios').textContent = '🕐 Horarios disponibles para ' + textoFecha + ':';
            document.getElementById('seccion-horarios').style.display = 'block';

            const grid = document.getElementById('grid-horarios');
            grid.innerHTML = '';

            HORARIOS.forEach(horario => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'boton';
                btn.textContent = horario;
                btn.id = 'btn-horario-' + numFecha + '-' + horario.replace(':', '-');
                btn.onclick = function(e) {
                    e.preventDefault();
                    seleccionarHorario(numFecha, horario);
                };
                grid.appendChild(btn);
            });

            console.log('→ Botones de horario creados:', HORARIOS.length);
        }

        // FUNCIÓN: Seleccionar horario
        function seleccionarHorario(numFecha, horario) {
            console.log('→ seleccionarHorario() llamado. Fecha:', numFecha, 'Horario:', horario);

            const btn = document.getElementById('btn-horario-' + numFecha + '-' + horario.replace(':', '-'));
            btn.classList.toggle('activo');

            const idx = horariosSeleccionados[numFecha].indexOf(horario);
            if (idx >= 0) {
                horariosSeleccionados[numFecha].splice(idx, 1);
            } else {
                horariosSeleccionados[numFecha].push(horario);
            }

            actualizarResumen();
        }

        // FUNCIÓN: Actualizar resumen
        function actualizarResumen() {
            console.log('→ actualizarResumen() llamado');

            if (fechasSeleccionadas.length === 0) {
                document.getElementById('info-resumen').style.display = 'none';
                return;
            }

            let html = '<ul>';
            fechasSeleccionadas.forEach(num => {
                const fecha = FECHAS.find(f => f.num === num);
                const horas = horariosSeleccionados[num] || [];
                html += '<li><strong>' + fecha.texto + ':</strong> ' + (horas.length > 0 ? horas.join(', ') : 'Sin horarios seleccionados') + '</li>';
            });
            html += '</ul>';

            document.getElementById('texto-resumen').innerHTML = html;
            document.getElementById('info-resumen').style.display = 'block';
        }

        // FUNCIÓN: Guardar
        function guardarDatos() {
            const empresa = document.getElementById('empresa').value;
            const email = document.getElementById('email').value;

            console.log('→ guardarDatos() llamado');
            console.log('  Empresa:', empresa);
            console.log('  Email:', email);
            console.log('  Fechas seleccionadas:', fechasSeleccionadas);
            console.log('  Horarios:', horariosSeleccionados);

            if (!empresa || !email) {
                alert('❌ Completa empresa y email');
                return;
            }

            if (fechasSeleccionadas.length === 0) {
                alert('❌ Selecciona al menos una fecha');
                return;
            }

            let totalHoras = 0;
            fechasSeleccionadas.forEach(f => {
                totalHoras += (horariosSeleccionados[f] || []).length;
            });

            if (totalHoras === 0) {
                alert('❌ Selecciona horarios para cada fecha');
                return;
            }

            const datos = {
                empresa: empresa,
                email: email,
                fechas: fechasSeleccionadas.slice(),
                horarios: {...horariosSeleccionados}
            };

            localStorage.setItem('empresa-' + empresa, JSON.stringify(datos));

            console.log('→ Datos guardados en localStorage');
            alert('✅ Guardado: ' + empresa + ' con ' + totalHoras + ' horarios\n\n' + JSON.stringify(datos, null, 2));
        }

        // ===== PANEL CDN - FUNCIONES =====

        // Cargar empresas en el dropdown de CDN
        function cargarEmpresasCDN() {
            const select = document.getElementById('empresa-cdn-select');
            select.innerHTML = '<option value="">-- Selecciona una empresa --</option>';
            
            // Obtener todas las empresas guardadas
            const empresas = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('empresa-')) {
                    const datos = JSON.parse(localStorage.getItem(key));
                    empresas.push(datos.empresa);
                }
            }
            
            // Agregar opciones al select
            empresas.forEach(emp => {
                const opt = document.createElement('option');
                opt.value = emp;
                opt.textContent = emp;
                select.appendChild(opt);
            });
            
            console.log('→ Empresas cargadas en panel CDN:', empresas);
        }

        // Cargar horarios de la empresa seleccionada
        function cargarHorariosCDN() {
            const empresa = document.getElementById('empresa-cdn-select').value;
            
            if (!empresa) {
                document.getElementById('seccion-horarios-cdn').style.display = 'none';
                return;
            }
            
            console.log('→ Cargando horarios para empresa:', empresa);
            
            // Obtener datos de la empresa
            const datos = JSON.parse(localStorage.getItem('empresa-' + empresa) || '{}');
            
            if (!datos.horarios) {
                console.log('→ No hay horarios disponibles');
                return;
            }
            
            const grid = document.getElementById('grid-horarios-cdn');
            grid.innerHTML = '';
            
            // Crear botones para cada horario disponible
            datos.fechas.forEach(numFecha => {
                const fecha = FECHAS.find(f => f.num === numFecha);
                const horariosDisponibles = datos.horarios[numFecha] || [];
                
                horariosDisponibles.forEach(horario => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'boton';
                    btn.textContent = fecha.texto + ' - ' + horario;
                    btn.id = 'btn-cdn-' + numFecha + '-' + horario.replace(':', '-');
                    btn.onclick = function(e) {
                        e.preventDefault();
                        seleccionarHorarioCDN(btn, numFecha, horario, fecha.texto);
                    };
                    grid.appendChild(btn);
                });
            });
            
            document.getElementById('seccion-horarios-cdn').style.display = 'block';
        }

        // Variable para guardar el horario seleccionado por CDN
        let horarioSeleccionadoCDN = null;

        // Seleccionar horario en panel CDN
        function seleccionarHorarioCDN(btn, numFecha, horario, textoFecha) {
            console.log('→ CDN selecciona horario:', textoFecha, horario);
            
            // Deseleccionar anterior
            document.querySelectorAll('#grid-horarios-cdn .boton').forEach(b => {
                b.classList.remove('activo');
            });
            
            // Seleccionar actual
            btn.classList.add('activo');
            horarioSeleccionadoCDN = { 
                fecha: numFecha, 
                horario: horario, 
                textoFecha: textoFecha 
            };
        }

        // Agendar reunión
        function agendarReunion() {
            const cdn = document.getElementById('cdn-select').value;
            const emailCdn = document.getElementById('cdn-email').value;
            const empresa = document.getElementById('empresa-cdn-select').value;
            
            console.log('→ agendarReunion() llamado');
            console.log('  CDN:', cdn);
            console.log('  Email CDN:', emailCdn);
            console.log('  Empresa:', empresa);
            console.log('  Horario seleccionado:', horarioSeleccionadoCDN);
            
            if (!cdn || !emailCdn || !empresa || !horarioSeleccionadoCDN) {
                alert('❌ Completa todos los campos y selecciona un horario');
                return;
            }
            
            // Obtener email de la empresa
            const datosEmpresa = JSON.parse(localStorage.getItem('empresa-' + empresa) || '{}');
            
            // Crear reunión
            const reunion = {
                cdn: cdn,
                emailCdn: emailCdn,
                empresa: empresa,
                emailEmpresa: datosEmpresa.email || '',
                fecha: horarioSeleccionadoCDN.textoFecha,
                horario: horarioSeleccionadoCDN.horario,
                fechaCreacion: new Date().toLocaleString('es-CL')
            };
            
            // Guardar en localStorage
            let reuniones = JSON.parse(localStorage.getItem('reuniones') || '[]');
            reuniones.push(reunion);
            localStorage.setItem('reuniones', JSON.stringify(reuniones));
            
            console.log('→ Reunión guardada:', reunion);
            
            // Mostrar confirmación
            const confirmacion = document.getElementById('confirmacion-cdn');
            const texto = document.getElementById('texto-confirmacion');
            texto.innerHTML = `
                <strong>${cdn}</strong> ↔ <strong>${empresa}</strong><br>
                📅 ${reunion.fecha} a las ${reunion.horario}<br>
                📧 Confirmación enviada a: ${emailCdn} y ${datosEmpresa.email}
            `;
            confirmacion.style.display = 'block';
            
            alert('✅ ¡Reunión agendada correctamente!\n\n' + cdn + ' ↔ ' + empresa + '\n' + reunion.fecha + ' - ' + reunion.horario);
            
            // Limpiar formulario
            setTimeout(() => {
                document.getElementById('cdn-select').value = '';
                document.getElementById('cdn-email').value = '';
                document.getElementById('empresa-cdn-select').value = '';
                document.getElementById('seccion-horarios-cdn').style.display = 'none';
                horarioSeleccionadoCDN = null;
            }, 2000);
        }

        // ===== PANEL VER REUNIONES =====
        function refrescarReuniones() {
            const reuniones = JSON.parse(localStorage.getItem('reuniones') || '[]');
            const container = document.getElementById('lista-reuniones');
            
            console.log('→ Mostrando reuniones agendadas:', reuniones.length);
            
            if (reuniones.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; font-size: 16px;">📭 No hay reuniones agendadas aún</p>';
                return;
            }
            
            container.innerHTML = '';
            reuniones.forEach((reunion, idx) => {
                const div = document.createElement('div');
                div.style.cssText = 'background: #f0f8ff; padding: 20px; margin: 15px 0; border-left: 5px solid #ff9800; border-radius: 4px;';
                div.innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 10px;">
                        <div>
                            <strong style="color: #333;">CDN:</strong><br>
                            ${reunion.cdn}<br>
                            <span style="font-size: 12px; color: #666;">📧 ${reunion.emailCdn}</span>
                        </div>
                        <div>
                            <strong style="color: #333;">Empresa:</strong><br>
                            ${reunion.empresa}<br>
                            <span style="font-size: 12px; color: #666;">📧 ${reunion.emailEmpresa}</span>
                        </div>
                    </div>
                    <div style="background: white; padding: 10px; border-radius: 4px; margin-top: 10px;">
                        <strong style="color: #ff9800;">📅 ${reunion.fecha} | 🕐 ${reunion.horario}</strong><br>
                        <span style="font-size: 12px; color: #999;">Agendada: ${reunion.fechaCreacion}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // ===== INICIALIZACIÓN =====
        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('empresa').addEventListener('change', mostrarFechas);
            document.getElementById('email').addEventListener('input', mostrarFechas);
            
            // Cargar empresas en panel CDN
            cargarEmpresasCDN();
            
            // Mostrar reuniones agendadas
            refrescarReuniones();
        });

        console.log('✅ Script cargado correctamente');
        console.log('FECHAS disponibles:', FECHAS.length);
        console.log('HORARIOS disponibles:', HORARIOS.length);
    </script>
</body>
</html>
