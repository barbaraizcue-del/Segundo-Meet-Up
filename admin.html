<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Meet Up - Administración</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            padding: 20px; 
            min-height: 100vh;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px; 
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        
        .botones-header {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 12px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #1976D2;
        }
        
        .btn-descargar {
            background: #4CAF50;
        }
        
        .btn-descargar:hover {
            background: #388E3C;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 4px;
            border-left: 4px solid #2196F3;
        }
        
        .stat-box h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-box .numero {
            color: #2196F3;
            font-size: 32px;
            font-weight: bold;
        }
        
        .tabla-container {
            overflow-x: auto;
            margin-top: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #ddd;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .reunion-item {
            background: #f0f8ff;
            padding: 20px;
            margin: 15px 0;
            border-left: 5px solid #ff9800;
            border-radius: 4px;
        }
        
        .reunion-item strong {
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        
        .reunion-item span {
            color: #666;
            font-size: 14px;
            display: block;
        }
        
        h2 { color: #333; margin-top: 30px; margin-bottom: 15px; }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 SEGUNDO MEET UP - PANEL DE ADMINISTRACIÓN</h1>
        <p class="subtitle">Monitorea todas las reuniones agendadas</p>
        
        <div class="botones-header">
            <button class="btn" onclick="refrescarDatos()">🔄 ACTUALIZAR</button>
            <button class="btn btn-descargar" onclick="descargarCSV()">📥 DESCARGAR CSV</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <h3>📋 Empresas Registradas</h3>
                <div class="numero" id="total-empresas">0</div>
            </div>
            <div class="stat-box" style="border-left-color: #ff9800;">
                <h3>📅 Reuniones Agendadas</h3>
                <div class="numero" id="total-reuniones" style="color: #ff9800;">0</div>
            </div>
            <div class="stat-box" style="border-left-color: #4CAF50;">
                <h3>👥 CDN Participantes</h3>
                <div class="numero" id="total-cdn" style="color: #4CAF50;">0</div>
            </div>
        </div>

        <h2>📋 EMPRESAS CON DISPONIBILIDAD REGISTRADA</h2>
        <div id="lista-empresas" class="tabla-container"></div>

        <h2>📅 REUNIONES AGENDADAS</h2>
        <div id="lista-reuniones"></div>
    </div>

    <script>
        function refrescarDatos() {
            // Contar empresas
            const empresas = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('empresa-')) {
                    empresas.push(key.replace('empresa-', ''));
                }
            }
            
            document.getElementById('total-empresas').textContent = empresas.length;
            
            // Contar reuniones
            const reuniones = JSON.parse(localStorage.getItem('reuniones') || '[]');
            document.getElementById('total-reuniones').textContent = reuniones.length;
            
            // Contar CDN únicos
            const cdnUnicos = new Set(reuniones.map(r => r.cdn));
            document.getElementById('total-cdn').textContent = cdnUnicos.size;
            
            // Listar empresas
            mostrarEmpresas(empresas);
            
            // Listar reuniones
            mostrarReuniones(reuniones);
        }

        function mostrarEmpresas(empresas) {
            const container = document.getElementById('lista-empresas');
            
            if (empresas.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 No hay empresas registradas aún</div>';
                return;
            }
            
            let html = '<table><tr><th>Empresa</th><th>Email</th><th>Fechas</th><th>Total Horarios</th></tr>';
            
            empresas.forEach(emp => {
                const datos = JSON.parse(localStorage.getItem('empresa-' + emp) || '{}');
                const totalHorarios = datos.fechas ? datos.fechas.reduce((sum, fecha) => sum + (datos.horarios[fecha] || []).length, 0) : 0;
                
                html += '<tr>';
                html += '<td><strong>' + emp + '</strong></td>';
                html += '<td>' + (datos.email || '-') + '</td>';
                html += '<td>' + (datos.fechas ? datos.fechas.length + ' fechas' : '0') + '</td>';
                html += '<td>' + totalHorarios + '</td>';
                html += '</tr>';
            });
            
            html += '</table>';
            container.innerHTML = html;
        }

        function mostrarReuniones(reuniones) {
            const container = document.getElementById('lista-reuniones');
            
            if (reuniones.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 No hay reuniones agendadas aún</div>';
                return;
            }
            
            container.innerHTML = '';
            reuniones.forEach((r, idx) => {
                const div = document.createElement('div');
                div.className = 'reunion-item';
                div.innerHTML = `
                    <strong>#${idx + 1}: ${r.cdn} ↔ ${r.empresa}</strong>
                    <span>📅 ${r.fecha} | 🕐 ${r.horario}</span>
                    <span>📧 ${r.emailCdn} | ${r.emailEmpresa}</span>
                    <span style="color: #999; font-size: 12px; margin-top: 5px;">Registrado: ${r.fechaCreacion}</span>
                `;
                container.appendChild(div);
            });
        }

        function descargarCSV() {
            const reuniones = JSON.parse(localStorage.getItem('reuniones') || '[]');
            
            if (reuniones.length === 0) {
                alert('❌ No hay reuniones para descargar');
                return;
            }
            
            let csv = 'CDN,Email CDN,Empresa,Email Empresa,Fecha,Hora,Fecha Agendamiento\n';
            
            reuniones.forEach(r => {
                csv += `"${r.cdn}","${r.emailCdn}","${r.empresa}","${r.emailEmpresa}","${r.fecha}","${r.horario}","${r.fechaCreacion}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'reuniones-segundo-meet-up.csv';
            a.click();
        }

        // Cargar datos al abrir
        window.addEventListener('DOMContentLoaded', refrescarDatos);
    </script>
</body>
</html>
